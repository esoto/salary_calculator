# Name of your application. Used to uniquely configure containers.
service: salary-calculator

# Name of the container image.
image: esoto/salary-calculator

# Deploy to these servers.
servers:
  web:
    - 178.104.88.183

# SSL via Let's Encrypt + kamal-proxy
proxy:
  ssl: true
  host: salary-calc.estebansoto.dev

# GitHub Container Registry
registry:
  server: ghcr.io
  username: esoto
  password:
    - KAMAL_REGISTRY_PASSWORD

# Environment variables injected into containers
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - SECRET_KEY_BASE
    - RESEND_API_KEY
  clear:
    RAILS_ENV: production
    SOLID_QUEUE_IN_PUMA: true
    # OAuth clients allowed to receive authorization codes. Comma-separated
    # list of exact-match redirect_uri values that /oauth/authorize will
    # honor. Adding a new consumer app requires adding its callback URL here.
    OAUTH_REDIRECT_URI_ALLOWLIST: "https://expense-tracker.estebansoto.dev/external_source/callback"

# Useful aliases
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent storage for Active Storage and Solid Queue/Cache/Cable
volumes:
  - "salary-calculator-storage:/rails/storage"

# Bridge assets between versions
asset_path: /rails/public/assets

# Build for amd64 (Hetzner server architecture)
builder:
  arch: amd64

# Use deploy user instead of root
ssh:
  user: deploy
